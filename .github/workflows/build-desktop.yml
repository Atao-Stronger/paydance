name: Build desktop packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pytest && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean "下班倒计时.spec"

      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path "dist/下班倒计时" -DestinationPath "dist/PayDance-Windows-x64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: paydance-windows-x64
          path: dist/PayDance-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS package
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements.txt

      - name: Build macOS application
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name PayDance
          --add-data "paydance.ico:."
          paydance.pyw

      - name: Create macOS archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/PayDance.app dist/PayDance-macOS.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: paydance-macos
          path: dist/PayDance-macOS.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
