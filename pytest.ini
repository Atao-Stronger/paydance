[pytest]
# 用 sys 级输出捕获，而不是 pytest 默认的 fd 级捕获。
#
# 原因：本项目的测试会创建大量真实的 Tk 窗口，每次 tkinter.Tk() 都要重新
# 初始化一个 Tcl 解释器并读取它自己的全部 .tcl 库文件。pytest 默认的 fd 级
# 捕获会把进程的 1/2 号文件描述符换成临时文件，在这个状态下 Tcl 初始化会
# 偶发读不到自己的库文件，报：
#     TclError: Can't find a usable tk.tcl ... / can't read "ttk/notebook.tcl"
# 换成一个测试挂 1~2 个，且失败用例每次都不同。
#
# 改用 sys 级捕获后，连续 11 次运行均 60 passed 全绿。
# 真实程序每次启动只建一个 Tk 解释器，从未出现该问题（25 次源码启动 +
# 12 次打包版启动全部成功），所以这只是测试环境的问题。
addopts = --capture=sys
testpaths = .
